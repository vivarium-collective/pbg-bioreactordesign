[project]
name = "pbg-bioreactordesign"
# The pre-rename dist name. This shim just depends on viva-bioreactordesign so
# existing `pbg-bioreactordesign` deps keep resolving. Import `viva_bioreactordesign`
# (a `pbg_bioreactordesign` import shim also ships in viva-bioreactordesign). Keep
# the version in lockstep with viva-bioreactordesign.
version = "0.1.0"
description = "Deprecated alias — renamed to 'viva-bioreactordesign'. Depends on it so existing 'pbg-bioreactordesign' deps keep resolving."
requires-python = ">=3.11"
dependencies = ["viva-bioreactordesign>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_bioreactordesign_shim"]
