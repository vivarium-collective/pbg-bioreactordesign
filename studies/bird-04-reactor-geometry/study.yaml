schema_version: 3
name: bird-04-reactor-geometry
status: planned
question: |
  Can the reactor support a stirred-tank kLa correlation (the benchmark
  geometry) alongside the bubble-column form, selectable by configuration?
hypothesis: |
  A geometry configuration field selects the kLa correlation, and under
  stirred-tank geometry kLa matches the published correlation for the
  configured power input and superficial gas velocity within tolerance.
objective: |
  Add a selectable stirred-tank kLa correlation and measure kLa against the
  published correlation to determine the model can be parameterized to a
  specific vessel.
description: |
  The high-cell-density benchmark uses a stirred-tank vessel; the current
  transport form assumes bubble-column. This study adds a configurable
  geometry and validates the stirred-tank kLa against literature, resolving
  the reactor-geometry-for-benchmark question from mbp-03. Builds on the
  coupled loop established in bird-02.
parent_studies:
  - {study: bird-02-closed-loop-liveness, condition: tests-passed}
# Behavior tests in the structured (given, measure, expect) grammar; all
# status: stub (xfail) until the stirred-tank geometry option is built and the
# coupled composite exists. The geometry-selection test is a config assertion
# the grammar doesn't express precisely — placeholder band, see notes.
expected_behavior:
  - name: geometry-selectable-via-config
    en: "Reactor geometry (stirred-tank vs bubble-column) is chosen by a
         configuration field, selecting the active kLa correlation."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "active_kla_correlation", reduce: series}
    expect: {op: in_range, low: 0.0, high: 1.0e6}
    status: stub
    requires: [{variant_hook: reactor_geometry}]
    notes: "Categorical/config assertion — real check is 'active correlation ==
            configured geometry'; placeholder band until an emitted geometry
            selector exists (this study's Build)."
  - name: kla-matches-stirred-tank-correlation
    en: "Under stirred-tank geometry, computed kLa matches the published
         correlation for the configured power input and superficial gas velocity
         within tolerance."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "kla_o2", reduce: median}
    expect: {op: in_range, low: 0.0, high: 1.0e6}
    status: stub
    requires: [{variant_hook: reactor_geometry}, {listener: kla_o2}]
    notes: "Real check is 'computed kLa within tolerance of the literature
            correlation value' at the configured P/V and u_g; finalize the band
            once the stirred-tank correlation is implemented."
baseline:
  - name: coupled-reactor-cell
    composite: pbg_bioreactordesign.coupled_reactor_cell
    params: {}
variants: []
interventions: []
runs: []
# NOTE: pbg_bioreactordesign.coupled_reactor_cell is the Phase-1 coupled
# composite (built in bird-01); this study is gated on bird-02 → bird-01.
# Named here so the spec documents intent and the study renders.
