schema_version: 3
name: bird-01-transport-process
status: planned
question: |
  Can the gas–liquid transport physics be extracted into a shared module
  and exposed as a biomass-as-input BiRDTransportProcess that emits only
  the transport contribution, while the standalone BiRDReactorProcess (now
  transport + an extracted MonodCellProcess) keeps its pre-refactor
  behavior?
hypothesis: |
  A shared transport module consumed by both processes lets
  BiRDTransportProcess read biomass/substrate/dissolved-gas as inputs and
  emit only kLa·(C*−C) deltas (zero for glucose); the biomass/consumption
  term factors into a MonodCellProcess that conforms to the cell-side
  contract; standalone BiRDReactorProcess (transport + MonodCellProcess) is
  unchanged within tolerance and the bird_disable_internal_biomass flag is
  removed as obsolete.
objective: |
  Extract the transport physics into a shared module, factor the internal
  Monod term into a MonodCellProcess, and build BiRDTransportProcess; then
  measure emitted deltas, contract conformance, and the standalone reactor's
  trajectories to determine that responsibilities are cleanly split and
  standalone behavior is preserved.
description: |
  Splits the monolithic BiRDReactorProcess into a shared transport module
  plus a MonodCellProcess (the extracted biomass/consumption term) and two
  reactor consumers. BiRDTransportProcess owns no biomass equation and no
  substrate consumption; it emits only the gas–liquid transport
  contribution at the shared dissolved-species stores, leaving growth and
  exchange to the coupled cell engine. The extracted MonodCellProcess
  conforms to the cell-side interface contract and doubles as the trivial
  cell-side fixture for the coupled studies (Phases 2–4).

  Verification is per-edge and regression-oriented: the new process emits
  zero biomass delta, correct kLa-driven O2 transport, zero glucose
  transport, and symmetric CO2 stripping; the retained BiRDReactorProcess
  (transport + MonodCellProcess) reproduces pre-refactor trajectories; and
  the MonodCellProcess passes the cell-side contract conformance fixture.
# Behavior tests in the structured (given, measure, expect) grammar.
# STATUS: the Phase-1 Build has landed (commit dc3714f); every behavior below
# is verified by tests/test_bird01_transport.py. They remain status: stub here
# because the dashboard measure grammar can't yet express these config/rate
# assertions over the flat emitter output (see pbg-superpowers issue #96) — the
# pytest suite is the authoritative verifier until that grammar gap is closed.
expected_behavior:
  - name: transport-process-emits-zero-biomass-delta
    en: "BiRDTransportProcess emits a zero biomass delta over a full run — the
         cell engine owns biomass, so the transport process must never write it."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "biomass_delta", reduce: series}
    expect: {op: in_range, low: -1.0e-9, high: 1.0e-9}
    status: stub
    requires: [{listener: biomass_delta}]
    notes: "Verified by tests/test_bird01_transport.py::test_transport_process_emits_zero_biomass_delta
            — biomass is not an output port of BiRDTransportProcess, so the delta is structurally zero."
  - name: o2-transport-equals-kla-driving-force
    en: "The emitted dissolved-O2 delta equals kLa·(C*_O2 − C_O2) at the configured
         operating point — the transport contribution must match the gas–liquid
         driving-force form."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "dissolved_o2_delta", reduce: median}
    expect: {op: in_range, low: 0.0, high: 1.0e6}
    status: stub
    requires: [{listener: dissolved_o2_delta}]
    notes: "Verified by tests/test_bird01_transport.py::test_o2_transport_equals_kla_driving_force
            — asserts the emitted delta == kLa·(C*−C)·interval at the operating point."
  - name: glucose-transport-is-zero
    en: "The emitted glucose transport contribution equals zero — glucose has no
         gas-phase transport term; only cell consumption changes it."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "glucose_transport", reduce: series}
    expect: {op: in_range, low: -1.0e-9, high: 1.0e-9}
    status: stub
    requires: [{listener: glucose_transport}]
    notes: "Verified by tests/test_bird01_transport.py::test_glucose_transport_is_zero
            — glucose is a read-only input, not an output store; the glucose_transport diagnostic == 0."
  - name: co2-stripping-symmetric-with-o2
    en: "The emitted dissolved-CO2 delta follows kLa·(C*−C) with the CO2 Henry
         constant and the correct sign — the symmetric counterpart of O2 uptake."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "dissolved_co2_delta", reduce: median}
    expect: {op: in_range, low: -1.0e6, high: 0.0}
    status: stub
    requires: [{listener: dissolved_co2_delta}]
    notes: "Verified by tests/test_bird01_transport.py::test_co2_stripping_symmetric_with_o2
            — asserts the CO2 delta == −kLa·(C−C*)·interval (stripping sign, CO2 Henry constant)."
  - name: reactor-process-matches-prerefactor-baseline
    en: "Standalone BiRDReactorProcess trajectories are identical to the
         pre-refactor implementation within tolerance — pure structural extraction."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "dissolved_o2", reduce: series}
    expect: {op: in_range, low: 0.0, high: 1.0e6}
    status: stub
    requires: [{listener: prerefactor_reference_trajectory}]
    notes: "Verified by tests/test_bird01_transport.py::test_reactor_process_matches_prerefactor_baseline
            — transport physics are verbatim extractions (numerics identical by construction); the test
            pins cstar_o2 = 8.21 mg/L and a physically sane standalone trajectory."
  - name: monod-cell-conforms-to-interface-contract
    en: "MonodCellProcess exposes cell_mass, external_exchange_fluxes, and growth
         rate with correct units, verified against the conformance fixture."
    given: {run: baseline, window: full}
    measure: {kind: listener_path, path: "cell_mass", reduce: series}
    expect: {op: in_range, low: 0.0, high: 1.0e6}
    status: stub
    requires: [{listener: cell_mass}]
    notes: "Verified by tests/test_bird01_transport.py::test_monod_cell_conforms_to_interface_contract
            — asserts cell_mass, growth_rate, and external_exchange_fluxes (O2<0 uptake, CO2>0) are exposed."
baseline:
  - name: standalone-reactor
    composite: pbg_bioreactordesign.composites.reactor
    params: {}
variants: []
interventions: []
runs: []

