report:
  verdict: not-yet-run
  confidence: low
  evidence_quality: aspirational
  objective: >-
    Split the monolithic BiRDReactorProcess into a shared transport module, an
    extracted MonodCellProcess, and a new biomass-as-input BiRDTransportProcess —
    preserving standalone reactor behavior while the new process emits only the
    gas–liquid transport contribution.
  main_insight: >-
    A single-responsibility split lets the reactor own only kLa·(C*−C) transport
