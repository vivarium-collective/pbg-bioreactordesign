# Declarative catalog spec for the coupled reactor↔cell composite.
#
# BiRDTransportProcess (reactor side, transport-only) + MonodCellProcess (cell
# side, biomass + exchange) wired to shared dissolved-species stores. The cell's
# consumption deltas and the reactor's transport deltas aggregate additively at
# dissolved_o2 / dissolved_co2 (bare float), so net d[O2]/dt = transport −
# consumption. The biomass store is written only by the cell; transport reads it.
#
# This is the data-first equivalent of make_coupled_document() in composites.py.
# Discovered as spec_id: viva_bioreactordesign.coupled_reactor_cell — the baseline
# referenced by studies bird-02 / bird-03 / bird-04.
#
# Defaults here use an impactful biomass density (5 g/L) with growth disabled —
# the static high-density fixture for the bird-02 closed-loop liveness test.

name: coupled_reactor_cell
description: >
  Coupled bioreactor: BiRDTransportProcess (gas-liquid transport only,
  biomass-as-input) composed with MonodCellProcess (the trivial cell-side
  engine that owns biomass + O2/CO2 exchange) at shared dissolved-species
  stores. Exercises the reactor→cell feedback a single-process reactor cannot.
tags: [mass-transfer, ode, kinetics, cells, systems-biology]

requires:
  processes: [BiRDTransportProcess, MonodCellProcess]

state:
  transport:
    _type: process
    address: "local:BiRDTransportProcess"
    interval: 1.0
    config:
      reactor_type: bubble_column
      volume_L: 20.0
      diameter_m: 0.2
      gas_flow_rate_Lpm: 1.0
      temperature_K: 298.15
      pressure_atm: 1.0
      o2_fraction_inlet: 0.21
      co2_fraction_inlet: 0.0004
      mean_bubble_diameter_mm: 3.0
      impeller_power_W: 0.0
    inputs:
      dissolved_o2: [stores, dissolved_o2]
      dissolved_co2: [stores, dissolved_co2]
      biomass: [stores, biomass]
      glucose: [stores, glucose]
      gas_flow_rate_Lpm: [stores, gas_flow_rate_Lpm]
    outputs:
      dissolved_o2: [stores, dissolved_o2]
      dissolved_co2: [stores, dissolved_co2]
      o2_transport_delta: [stores, o2_transport_delta]
      co2_transport_delta: [stores, co2_transport_delta]
      kla_o2: [stores, kla_o2]
      o2_saturation: [stores, o2_saturation]
      gas_holdup: [stores, gas_holdup]
  cell:
    _type: process
    address: "local:MonodCellProcess"
    interval: 1.0
    config:
      initial_biomass_gL: 5.0
      max_growth_rate_per_h: 0.4
      ks_oxygen_mgL: 0.2
      yield_biomass_o2: 1.2
      maintenance_coeff_per_h: 0.01
      respiratory_quotient: 1.0
      growth_enabled: false
    inputs:
      dissolved_o2: [stores, dissolved_o2]
    outputs:
      biomass: [stores, biomass]
      dissolved_o2: [stores, dissolved_o2]
      dissolved_co2: [stores, dissolved_co2]
      cell_mass: [stores, cell_mass]
      growth_rate: [stores, specific_growth_rate]
      external_exchange_fluxes: [stores, external_exchange_fluxes]
      o2_exchange_delta: [stores, o2_exchange_delta]
  stores:
    dissolved_o2: 8.0
    dissolved_co2: 0.5
    biomass: 5.0
    glucose: 10.0
    gas_flow_rate_Lpm: 1.0
  emitter:
    _type: step
    address: "local:ram-emitter"
    config:
      emit:
        dissolved_o2: float
        dissolved_co2: float
        biomass: float
        cell_mass: float
        specific_growth_rate: float
        o2_transport_delta: float
        o2_exchange_delta: float
        kla_o2: float
        time: float
    inputs:
      dissolved_o2: [stores, dissolved_o2]
      dissolved_co2: [stores, dissolved_co2]
      biomass: [stores, biomass]
      cell_mass: [stores, cell_mass]
      specific_growth_rate: [stores, specific_growth_rate]
      o2_transport_delta: [stores, o2_transport_delta]
      o2_exchange_delta: [stores, o2_exchange_delta]
      kla_o2: [stores, kla_o2]
      time: [global_time]
