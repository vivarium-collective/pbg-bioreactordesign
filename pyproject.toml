[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-bioreactordesign"
version = "0.1.0"
description = "Process-bigraph wrapper for BioReactorDesign (BiRD) bioreactor simulation"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "pbg-superpowers",
    "pyyaml",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz", "matplotlib"]
bird = ["nlr-bird"]

[tool.uv.sources]
# The pbg-superpowers dist is the deprecation shim in the viva-superpowers
# repo's shim/ subdir (the repo root was renamed to viva-superpowers). Point
# at the subdir so the "pbg-superpowers" name resolves (re-exports viva_superpowers).
pbg-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main", subdirectory = "shim" }

[tool.setuptools.packages.find]
include = ["viva_bioreactordesign*", "pbg_bioreactordesign*"]  # viva_bioreactordesign real; pbg_bioreactordesign = back-compat import shim
