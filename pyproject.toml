[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbg-bioreactordesign"
version = "0.1.0"
description = "Process-bigraph wrapper for BioReactorDesign (BiRD) bioreactor simulation"
requires-python = ">=3.9"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz", "matplotlib"]
bird = ["nlr-bird"]

[tool.setuptools.packages.find]
include = ["pbg_bioreactordesign*"]
