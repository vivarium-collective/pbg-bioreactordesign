name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12.9
      - name: Install (dev extras; validates the rename + shims)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Test
        run: |
          source .venv/bin/activate
          pytest -q
