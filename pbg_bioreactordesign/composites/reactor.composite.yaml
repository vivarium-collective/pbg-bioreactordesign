# Declarative catalog spec for the standalone 0D BiRD bioreactor.
#
# This is the data-first equivalent of make_reactor_document() in this
# package's composites/__init__.py (the Python factory). It exists so the
# dashboard catalog can discover, display, and run the standalone reactor,
# and so studies can name it as a `baseline:` composite.
#
# Lives in pbg_bioreactordesign/composites/ so BOTH discovery paths find it:
# pbg_superpowers.composite_discovery (rglob) AND the dashboard's
# composite_lookup (which globs <pkg>/composites/ only).
# spec_id: pbg_bioreactordesign.composites.reactor

name: reactor
description: >
  Standalone 0D (well-mixed) BiRD bioreactor: BiRDReactorProcess owns both
  gas-liquid transport (Higbie kLa, Henry's law, Wilke-Chang) and internal
  Monod biomass growth, wired to dissolved-species stores with a RAM emitter.
  This is the pre-refactor baseline that bird-01 must preserve after the
  transport/biomass responsibility split.
tags: [mass-transfer, ode, kinetics, systems-biology]

requires:
  processes: [BiRDReactorProcess]

state:
  reactor:
    _type: process
    address: "local:BiRDReactorProcess"
    interval: 1.0
    config:
      reactor_type: bubble_column
      volume_L: 20.0
      diameter_m: 0.2
      liquid_height_m: 0.5
      gas_flow_rate_Lpm: 1.0
      temperature_K: 298.15
      pressure_atm: 1.0
      o2_fraction_inlet: 0.21
      co2_fraction_inlet: 0.0004
      mean_bubble_diameter_mm: 3.0
      initial_biomass_gL: 0.5
      initial_do_mgL: 8.0
      initial_dco2_mgL: 0.5
      max_growth_rate_per_h: 0.4
      ks_oxygen_mgL: 0.2
      yield_biomass_o2: 1.2
      maintenance_coeff_per_h: 0.01
      respiratory_quotient: 1.0
      impeller_power_W: 0.0
    inputs:
      gas_flow_rate_Lpm: [stores, gas_flow_rate_Lpm]
    outputs:
      dissolved_o2: [stores, dissolved_o2]
      dissolved_co2: [stores, dissolved_co2]
      biomass: [stores, biomass]
      gas_holdup: [stores, gas_holdup]
      kla_o2: [stores, kla_o2]
      kla_co2: [stores, kla_co2]
      bubble_diameter_mm: [stores, bubble_diameter_mm]
      o2_saturation: [stores, o2_saturation]
      co2_saturation: [stores, co2_saturation]
      specific_growth_rate: [stores, specific_growth_rate]
      o2_uptake_rate: [stores, o2_uptake_rate]
      co2_evolution_rate: [stores, co2_evolution_rate]
      superficial_gas_velocity: [stores, superficial_gas_velocity]
  stores:
    gas_flow_rate_Lpm: 1.0
  emitter:
    _type: step
    address: "local:ram-emitter"
    config:
      emit:
        dissolved_o2: float
        dissolved_co2: float
        biomass: float
        gas_holdup: float
        kla_o2: float
        o2_uptake_rate: float
        co2_evolution_rate: float
        specific_growth_rate: float
        time: float
    inputs:
      dissolved_o2: [stores, dissolved_o2]
      dissolved_co2: [stores, dissolved_co2]
      biomass: [stores, biomass]
      gas_holdup: [stores, gas_holdup]
      kla_o2: [stores, kla_o2]
      o2_uptake_rate: [stores, o2_uptake_rate]
      co2_evolution_rate: [stores, co2_evolution_rate]
      specific_growth_rate: [stores, specific_growth_rate]
      time: [global_time]
